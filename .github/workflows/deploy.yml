name: Deploy Workflow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/*.png _site/ 2>/dev/null || true
          cp index.md _site/index.md
          cp README.md _site/README.md
          cp LIFECYCLE.md _site/LIFECYCLE.md
          cp -r docs _site/docs 2>/dev/null || true
          cp -r guidelines _site/guidelines 2>/dev/null || true
          cp -r templates _site/templates 2>/dev/null || true
          cp -r integration _site/integration 2>/dev/null || true
          cp -r 01-discover _site/01-discover 2>/dev/null || true
          cp -r 02-coordinate _site/02-coordinate 2>/dev/null || true
          cp -r 03-execute _site/03-execute 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
